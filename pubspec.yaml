name: mi_tianguis
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.6+7

environment:
  sdk: '^3.6.2'

dependencies:
  cached_network_image: ^3.4.1
  cloud_firestore: ^6.4.0
  firebase_core: ^4.8.0
  firebase_storage: ^13.4.0
  font_awesome_flutter: ^11.0.0
  flutter:
    sdk: flutter
  hive_flutter: ^1.1.0
  package_info_plus: ^9.0.1
  path_provider: ^2.1.5
  provider: ^6.1.5
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2
  change_app_package_name: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/iconos_categorias/

flutter_icons:
  android: true
  ios: true
  image_path: "assets/iconos/app_icon.png"
